[project]
name = "memrise-workspace"
version = "0.1.0"
description = "Memrise monorepo workspace."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/engine",
  "packages/evals",
]

[tool.uv.sources]
memrise = { workspace = true }
memrise-api = { workspace = true }
memrise-worker = { workspace = true }
memrise-evals = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = [
  "apps/api/src",
  "apps/worker/src",
  "packages/engine/src",
  "packages/evals/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
  "packages/engine/tests/unit",
  "packages/evals/tests",
  "tests/contract",
]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportDeprecated = false
include = [
  "apps/api/src",
  "apps/worker/src",
  "packages/engine/src",
  "packages/evals/src",
  "scripts",
]
exclude = ["**/.venv", "**/__pycache__"]
