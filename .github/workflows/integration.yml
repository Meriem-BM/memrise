name: Integration

on:
  pull_request:
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.4-pg18-trixie
        env:
          POSTGRES_USER: memrise
          POSTGRES_PASSWORD: memrise
          POSTGRES_DB: memrise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memrise -d memrise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://memrise:memrise@localhost:5432/memrise
      MEMRISE_USE_FAKE_MODEL: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8
      - run: uv sync --frozen --all-packages
      - run: uv run alembic -c packages/engine/alembic.ini upgrade head
      - run: uv run pytest tests/integration
