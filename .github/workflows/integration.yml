name: Integration

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://memrise:memrise@localhost:5432/memrise
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8
      - run: docker compose -f infra/compose.yaml build postgres
      - run: docker compose -f infra/compose.yaml up -d postgres
      - run: |
          for _ in $(seq 1 40); do
            if docker compose -f infra/compose.yaml exec -T postgres pg_isready -U memrise -d memrise; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: uv sync --frozen --all-packages
      - run: uv run alembic -c packages/engine/alembic.ini upgrade head
      - run: uv run pytest tests/integration
      - if: always()
        run: docker compose -f infra/compose.yaml down -v
