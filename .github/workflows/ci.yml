name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: corepack enable
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest packages/engine/tests/unit packages/evals/tests tests/contract
      - run: pnpm --recursive lint
      - run: pnpm --recursive typecheck
      - run: pnpm --recursive test
      - run: pnpm --filter @memrise/sdk build
      - run: pnpm --filter @memrise/web build
      - run: uv run python scripts/export_openapi.py
      - run: pnpm --filter @memrise/sdk generate
      - run: git diff --exit-code docs/openapi.json packages/sdk-typescript/src/generated/api-types.ts
