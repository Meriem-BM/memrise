services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memrise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memrise}
      POSTGRES_DB: ${POSTGRES_DB:-memrise}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memrise} -d ${POSTGRES_DB:-memrise}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres18-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://memrise:memrise@postgres:5432/memrise
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "packages/engine/alembic.ini", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://memrise:memrise@postgres:5432/memrise
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health/live'', timeout=2)"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://memrise:memrise@postgres:5432/memrise
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_MEMRISE_API_URL: http://localhost:8000
      NEXT_PUBLIC_MEMRISE_API_KEY: local-dev-key
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres18-data:
