[project]
name = "memrise-evals"
version = "0.1.0"
description = "Evaluation fixtures and metrics for Memrise."
requires-python = ">=3.14,<3.15"
dependencies = ["memrise"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrise_evals"]

