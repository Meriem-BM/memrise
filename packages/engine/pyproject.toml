[project]
name = "memrise-memory"
version = "0.1.0"
description = "Core Python memory engine for Memrise."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrise"]
