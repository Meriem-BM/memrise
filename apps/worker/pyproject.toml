[project]
name = "memrise-worker"
version = "0.1.0"
description = "PostgreSQL-backed background worker for Memrise."
requires-python = ">=3.14,<3.15"
dependencies = ["memrise-memory"]

[project.scripts]
memrise-worker = "memrise_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrise_worker"]
